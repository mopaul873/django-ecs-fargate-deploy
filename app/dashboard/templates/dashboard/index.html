<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Analytics Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f6f8; color: #222; }
    h1 { margin-bottom: 4px; }
    .version { color: #777; font-size: 13px; margin-bottom: 24px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { padding: 10px 14px; border-bottom: 1px solid #e3e3e3; text-align: left; }
    th { background: #232f3e; color: #fff; }
  </style>
</head>
<body>
  <h1>Media Analytics Dashboard</h1>
  <div class="version">Clients: {{ client_count }} &middot; Version: {{ version }}</div>

  <table>
    <tr><th>Client</th><th>Total views</th><th>Avg engagement (%)</th></tr>
    {% for row in summary %}
      <tr>
        <td>{{ row.client__name }}</td>
        <td>{{ row.total_views }}</td>
        <td>{{ row.avg_engagement|floatformat:2 }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No metrics yet. Add some in the admin at /admin/.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
