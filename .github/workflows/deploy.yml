# Build -> push to ECR -> run DB migrations -> rolling deploy to ECS (zero downtime)
name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml" 
  workflow_dispatch: # allow manual runs from the Actions tab

# Needed for OIDC login to AWS (no stored AWS keys)
permissions:
  id-token: write
  contents: read

# Never run two deployments at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: web

jobs:
  # ---------------------------------------------------------------
  # 1. Test against a real PostgreSQL, same engine as production
  # ---------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_NAME: analytics
      DB_USER: analytics
      DB_PASSWORD: testpass
      DJANGO_SECRET_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Fail if a model change has no migration file
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  # ---------------------------------------------------------------
  # 2. Build the image, scan it, push it to ECR tagged with the commit SHA
  # ---------------------------------------------------------------
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" app

      - name: Push image to ECR
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Block deploy if ECR scan finds CRITICAL vulnerabilities
        run: |
          # ECR scans every pushed image (scan_on_push = true in Terraform),
          # but the scan record can take a few seconds to appear after the push.
          # Poll until it exists (up to 5 minutes), then wait for it to finish.
          for i in $(seq 1 30); do
            if aws ecr describe-image-scan-findings \
                 --repository-name "$ECR_REPOSITORY" --image-id imageTag=${{ github.sha }} > /dev/null 2>&1; then
              echo "Scan found after $((i * 10)) seconds"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::No ECR scan appeared for this image after 5 minutes"
              exit 1
            fi
            echo "Waiting for ECR to start the scan..."
            sleep 10
          done

          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" --image-id imageTag=${{ github.sha }}

          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" --image-id imageTag=${{ github.sha }} \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          echo "Critical findings: $CRITICAL"
          if [ "$CRITICAL" != "None" ] && [ "$CRITICAL" != "0" ]; then
            echo "::error::Image has $CRITICAL CRITICAL vulnerabilities - not deploying"
            exit 1
          fi

  # ---------------------------------------------------------------
  # 3. Migrate the database, then roll out the new image
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS
    needs: build
    runs-on: ubuntu-latest
    environment: production # optional manual approval gate (GitHub > Settings > Environments)

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}

      - name: Register new task definition revision
        id: register
        run: |
          # Remove read-only fields that describe-task-definition returns but register does not accept
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render.outputs.task-definition }}" > new-task-def.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "New task definition: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations (one-off task)
        run: |
          # Reuse the service's subnets and security group so the task can reach RDS
          NETWORK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" --output text)
          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migrations failed - deployment stopped. Old version is still running."
            exit 1
          fi

      - name: Rolling update of the ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" > /dev/null

          echo "Waiting for new tasks to pass health checks and old tasks to drain..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Confirm the new version is live
        run: |
          # If the circuit breaker rolled back, the primary deployment will not be our revision
          RUNNING=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          if [ "$RUNNING" != "${{ steps.register.outputs.arn }}" ]; then
            echo "::error::Deployment was rolled back by the ECS circuit breaker. Running: $RUNNING"
            exit 1
          fi

          if [ -n "${{ vars.APP_URL }}" ]; then
            curl --fail --silent --retry 5 --retry-delay 5 "${{ vars.APP_URL }}/health/"
          fi
          echo "Deployed ${{ github.sha }} successfully"
