# Runs on every pull request: app tests, Docker build, Terraform checks.
# Nothing is deployed and no AWS credentials are used.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t analytics:pr-${{ github.event.number }} app

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
