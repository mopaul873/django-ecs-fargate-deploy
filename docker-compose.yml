# Local development: the same image that runs on ECS, plus PostgreSQL
# Usage: docker compose up --build   then open http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: localpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 5s
      retries: 10

  web:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-dev-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: db
      DB_NAME: analytics
      DB_USER: analytics
      DB_PASSWORD: localpass
      APP_VERSION: local
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application -c gunicorn.conf.py"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
